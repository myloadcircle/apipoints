<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <title>Verify Email — APIPoints</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --bg:#0a0a0a; --lime:#a3e635; --lime-light:#cbe86b; --text:#e9e9e9; --muted:#888; }
    body { background:var(--bg); color:var(--text); font-family:'Inter',system-ui,-apple-system,sans-serif; }
    a { color:var(--lime); text-decoration:none; }
    .nav { display:flex; align-items:center; justify-content:space-between; padding:16px 32px; background:rgba(11,11,11,0.9); backdrop-filter:blur(20px); border-bottom:1px solid rgba(255,255,255,0.08); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; }
    .brand .dot { width:10px; height:10px; background:var(--lime); border-radius:50%; box-shadow:0 0 15px var(--lime); }
    .container { max-width:480px; margin:80px auto; padding:0 20px; text-align:center; }
    .icon { font-size:48px; margin-bottom:24px; }
    h1 { font-family:Georgia,serif; font-size:28px; font-weight:700; margin-bottom:12px; color:#fff; }
    .subtitle { color:var(--muted); font-size:14px; line-height:1.6; margin-bottom:32px; }
    .btn { display:inline-block; padding:14px 32px; border-radius:10px; border:none; background:linear-gradient(135deg,var(--lime),var(--lime-light)); color:#111; font-weight:700; font-size:14px; cursor:pointer; transition:all 0.3s; text-decoration:none; }
    .btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(163,230,53,0.4); }
    .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
    .success { background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.3); color:#22c55e; padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:16px; display:none; }
    .error { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#ef4444; padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:16px; display:none; }
    .loading { display:block; text-align:center; padding:20px; }
    .spinner { display:inline-block; width:24px; height:24px; border:2px solid var(--lime); border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .footer { text-align:center; margin-top:40px; color:#555; font-size:12px; }
  </style>
</head>
<body>
  <header class="nav">
    <div class="brand"><span class="dot"></span><span>APIPoints</span></div>
    <a href="/" style="color:#ccc; font-size:14px;">← Back to Home</a>
  </header>
  <div class="container">
    <div id="loading-state">
      <div class="icon">🔐</div>
      <h1>Verifying your email...</h1>
      <div class="loading"><div class="spinner"></div></div>
    </div>
    <div id="success-state" style="display:none;">
      <div class="icon">✅</div>
      <h1>Email verified!</h1>
      <p class="subtitle">Your account is now active with <strong style="color:var(--lime);">5,000 free credits</strong>.</p>
      <div id="success-message" class="success" style="display:block;"></div>
      <a href="/dashboard.html" class="btn" style="margin-top:16px;">Go to Dashboard →</a>
    </div>
    <div id="error-state" style="display:none;">
      <div class="icon">❌</div>
      <h1>Verification failed</h1>
      <div id="error-message" class="error" style="display:block;"></div>
      <div style="margin-top:24px;">
        <a href="/check-email.html" class="btn">Resend Verification →</a>
      </div>
    </div>
  </div>
  <div class="footer"><a href="/privacy.html">Privacy</a> • <a href="/terms.html">Terms</a> • © 2026 APIPoints</div>
  <script>
    const API = 'https://apipoints-worker.francis-e3b.workers.dev';
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      if (!token) {
        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('error-state').style.display = 'block';
        document.getElementById('error-message').textContent = 'No verification token found.';
        return;
      }
      try {
        const res = await fetch(API + '/api/auth/verify-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        const data = await res.json();
        if (data.error) {
          document.getElementById('loading-state').style.display = 'none';
          document.getElementById('error-state').style.display = 'block';
          document.getElementById('error-message').textContent = data.error;
        } else {
          // Store JWT and user
          localStorage.setItem('ap_token', data.token);
          localStorage.setItem('ap_user', JSON.stringify(data.user));
          localStorage.removeItem('ap_pending_email');
          document.getElementById('loading-state').style.display = 'none';
          document.getElementById('success-state').style.display = 'block';
          document.getElementById('success-message').textContent = 'Welcome to APIPoints! Redirecting to dashboard...';
          setTimeout(() => { window.location.href = '/dashboard.html'; }, 2000);
        }
      } catch (err) {
        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('error-state').style.display = 'block';
        document.getElementById('error-message').textContent = 'Network error. Please try again.';
      }
    })();
  </script>
</body>
</html>
