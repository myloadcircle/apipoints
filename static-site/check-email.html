<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <title>Check Your Email — APIPoints</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --bg:#0a0a0a; --lime:#a3e635; --lime-light:#cbe86b; --text:#e9e9e9; --muted:#888; }
    body { background:var(--bg); color:var(--text); font-family:'Inter',system-ui,-apple-system,sans-serif; }
    a { color:var(--lime); text-decoration:none; }
    .nav { display:flex; align-items:center; justify-content:space-between; padding:16px 32px; background:rgba(11,11,11,0.9); backdrop-filter:blur(20px); border-bottom:1px solid rgba(255,255,255,0.08); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; }
    .brand .dot { width:10px; height:10px; background:var(--lime); border-radius:50%; box-shadow:0 0 15px var(--lime); }
    .container { max-width:480px; margin:80px auto; padding:0 20px; text-align:center; }
    .icon { font-size:48px; margin-bottom:24px; }
    h1 { font-family:Georgia,serif; font-size:28px; font-weight:700; margin-bottom:12px; color:#fff; }
    .subtitle { color:var(--muted); font-size:14px; line-height:1.6; margin-bottom:32px; }
    .email-display { display:inline-block; background:rgba(163,230,53,0.1); border:1px solid rgba(163,230,53,0.2); border-radius:8px; padding:10px 20px; font-size:14px; color:var(--lime); margin-bottom:32px; }
    .btn { display:inline-block; padding:14px 32px; border-radius:10px; border:none; background:linear-gradient(135deg,var(--lime),var(--lime-light)); color:#111; font-weight:700; font-size:14px; cursor:pointer; transition:all 0.3s; text-decoration:none; }
    .btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(163,230,53,0.4); }
    .btn-outline { background:transparent; border:1px solid rgba(255,255,255,0.2); color:var(--text); }
    .btn-outline:hover { border-color:var(--lime); color:var(--lime); box-shadow:none; }
    .actions { display:flex; gap:12px; justify-content:center; margin-bottom:24px; }
    .success { background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.3); color:#22c55e; padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:16px; display:none; }
    .error { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#ef4444; padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:16px; display:none; }
    .footer { text-align:center; margin-top:40px; color:#555; font-size:12px; }
    .resend-text { color:var(--muted); font-size:13px; margin-top:16px; }
  </style>
</head>
<body>
  <header class="nav">
    <div class="brand"><span class="dot"></span><span>APIPoints</span></div>
    <a href="/" style="color:#ccc; font-size:14px;">← Back to Home</a>
  </header>
  <div class="container">
    <div class="icon">📧</div>
    <h1>Check your email</h1>
    <p class="subtitle">We sent a verification link to:</p>
    <div class="email-display" id="email-display">your email</div>
    <p class="subtitle">Click the link in the email to activate your account. The link expires in 24 hours.</p>
    <div id="success-message" class="success"></div>
    <div id="error-message" class="error"></div>
    <div class="actions">
      <button class="btn btn-outline" id="resend-btn" onclick="resendVerification()">Resend email</button>
      <a href="/login.html" class="btn">Go to Login →</a>
    </div>
    <p class="resend-text" id="resend-status"></p>
  </div>
  <div class="footer"><a href="/privacy.html">Privacy</a> • <a href="/terms.html">Terms</a> • © 2026 APIPoints</div>
  <script>
    const API = 'https://apipoints-worker.francis-e3b.workers.dev';
    // Show the email from signup
    const pendingEmail = localStorage.getItem('ap_pending_email');
    if (pendingEmail) {
      document.getElementById('email-display').textContent = pendingEmail;
    }
    async function resendVerification() {
      const email = localStorage.getItem('ap_pending_email');
      if (!email) { document.getElementById('error-message').textContent = 'No email found. Please register again.'; document.getElementById('error-message').style.display = 'block'; return; }
      const btn = document.getElementById('resend-btn');
      btn.disabled = true; btn.textContent = 'Sending...';
      document.getElementById('success-message').style.display = 'none';
      document.getElementById('error-message').style.display = 'none';
      try {
        const res = await fetch(API + '/api/auth/resend-verification', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
        const data = await res.json();
        document.getElementById('success-message').textContent = data.message || 'Verification email resent!';
        document.getElementById('success-message').style.display = 'block';
        document.getElementById('resend-status').textContent = 'Check your inbox again.';
      } catch (err) {
        document.getElementById('error-message').textContent = 'Network error. Try again.';
        document.getElementById('error-message').style.display = 'block';
      }
      btn.disabled = false; btn.textContent = 'Resend email';
    }
  </script>
</body>
</html>
