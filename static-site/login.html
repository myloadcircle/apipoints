<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="index, follow" />
  <meta name="googlebot" content="index, follow" />
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="alternate" hreflang="en" href="https://apipoints.dev/login?lang=en" />
  <link rel="alternate" hreflang="zh" href="https://apipoints.dev/login?lang=zh" />
  <link rel="alternate" hreflang="es" href="https://apipoints.dev/login?lang=es" />
  <link rel="alternate" hreflang="ar" href="https://apipoints.dev/login?lang=ar" />
  <link rel="alternate" hreflang="ja" href="https://apipoints.dev/login?lang=ja" />
  <link rel="alternate" hreflang="de" href="https://apipoints.dev/login?lang=de" />
  <link rel="alternate" hreflang="fr" href="https://apipoints.dev/login?lang=fr" />
  <link rel="alternate" hreflang="pt-BR" href="https://apipoints.dev/login?lang=pt-BR" />
  <link rel="alternate" hreflang="x-default" href="https://apipoints.dev/login" />
  <title>Login — APIPoints</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --bg:#0a0a0a; --bg2:#111; --lime:#a3e635; --lime-light:#cbe86b; --text:#e9e9e9; --muted:#888; }
    body { background:var(--bg); color:var(--text); font-family:'Inter',system-ui,-apple-system,sans-serif; }
    a { color:var(--lime); text-decoration:none; }
    .nav { display:flex; align-items:center; justify-content:space-between; padding:16px 32px; background:rgba(11,11,11,0.9); backdrop-filter:blur(20px); border-bottom:1px solid rgba(255,255,255,0.08); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; }
    .brand .dot { width:10px; height:10px; background:var(--lime); border-radius:50%; box-shadow:0 0 15px var(--lime); }
    .container { max-width:440px; margin:80px auto; padding:0 20px; }
    h1 { font-family:Georgia,serif; font-size:32px; font-weight:700; margin-bottom:8px; color:#fff; }
    .subtitle { color:var(--muted); font-size:14px; margin-bottom:32px; }
    .form-group { margin-bottom:20px; }
    label { display:block; font-size:12px; color:#888; margin-bottom:6px; text-transform:uppercase; letter-spacing:1px; }
    input { width:100%; padding:12px 16px; border-radius:10px; border:1px solid rgba(255,255,255,0.15); background:var(--bg); color:#fff; font-size:15px; box-sizing:border-box; transition:border-color 0.3s; }
    input:focus { outline:none; border-color:var(--lime); }
    .btn { width:100%; padding:14px; border-radius:10px; border:none; background:linear-gradient(135deg,var(--lime),var(--lime-light)); color:#111; font-weight:700; font-size:15px; cursor:pointer; transition:all 0.3s; margin-top:8px; }
    .btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(163,230,53,0.4); }
    .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
    .error { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#ef4444; padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:16px; display:none; }
    .toggle { text-align:center; margin-top:20px; color:var(--muted); font-size:14px; }
    .toggle a { color:var(--lime); cursor:pointer; }
    .footer { text-align:center; margin-top:40px; color:#555; font-size:12px; }
    .loading { display:none; text-align:center; padding:20px; }
    .spinner { display:inline-block; width:20px; height:20px; border:2px solid var(--lime); border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <header class="nav">
    <div class="brand"><span class="dot"></span><span>APIPoints</span></div>
    <div style="display:flex; align-items:center; gap:16px;">
      <a href="/" style="color:#ccc; font-size:14px;" data-i18n="nav.backToHome">← Back to Home</a>
      <span id="i18n-switcher"></span>
    </div>
  </header>
  <div class="container">
    <h1 data-i18n="login.title">Welcome Back</h1>
    <p class="subtitle" data-i18n="login.subtitle">Sign in to your APIPoints account.</p>
    <div id="error-message" class="error"></div>
    <form id="login-form">
      <div class="form-group">
        <label data-i18n="login.email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" data-i18n-placeholder="login.emailPlaceholder" required />
      </div>
      <div class="form-group">
        <label data-i18n="login.password">Password</label>
        <input type="password" id="password" placeholder="Your password" data-i18n-placeholder="login.passwordPlaceholder" required />
      </div>
      <button type="submit" class="btn" id="submit-btn" data-i18n="login.submit">Sign In</button>
    </form>
    <div class="loading" id="loading"><div class="spinner"></div><span style="margin-left:8px; color:#888;" data-i18n="login.loading">Signing in...</span></div>
    <div class="toggle"><span data-i18n="login.noAccount">Don't have an account?</span> <a href="/register.html" data-i18n="login.registerLink">Register →</a></div>
  </div>
  <div class="footer"><a href="/privacy.html">Privacy</a> • <a href="/terms.html">Terms</a> • © 2026 APIPoints</div>
  <script src="/i18n.js"></script>
  <script>
    const API = 'https://apipoints-worker.francis-e3b.workers.dev';
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');
      errorDiv.style.display = 'none';
      if (!email || !password) { errorDiv.textContent = 'Email and password required.'; errorDiv.style.display = 'block'; return; }
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('loading').style.display = 'block';
      try {
        const res = await fetch(API + '/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const data = await res.json();
        if (data.error) { errorDiv.textContent = data.error; errorDiv.style.display = 'block'; }
        else {
          localStorage.setItem('ap_token', data.token);
          localStorage.setItem('ap_user', JSON.stringify(data.user));
          window.location.href = '/dashboard.html';
        }
      } catch (err) { errorDiv.textContent = 'Network error. Try again.'; errorDiv.style.display = 'block'; }
      finally { document.getElementById('submit-btn').disabled = false; document.getElementById('loading').style.display = 'none'; }
    });
  </script>
</body>
</html>
